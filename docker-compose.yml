  #     - BACKEND_URL=http://demo-be:4000
  #   ports:
  #     - "${DEMO_FE_PORT:-3000}:80"
  #   networks:
  #     - devops-net

  # 6. Central Prometheus (Scrapes Jenkins + In-Cluster K3s Prometheus + Alert Rules)
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    networks:
      - devops-net

  # 7. Central Grafana (Pre-provisioned Datasources & Dashboards)
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infra/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - devops-net

  # 8. Blackbox Exporter (HTTP/HTTPS Synthetic Probing for Demo App)
  blackbox-exporter:
    image: ${BLACKBOX_IMAGE:-prom/blackbox-exporter:v0.25.0}
    container_name: blackbox-exporter
    restart: unless-stopped
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./infra/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - devops-net

volumes:
  registry_data:
  dind_storage:
  k3s_server:
  k3s_kubeconfig:
  jenkins_home:
  jenkins_agent_workdir:
  prometheus_data:
  grafana_data:

networks:
  devops-net:
    driver: bridge
