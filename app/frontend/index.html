<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Demo Application</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; border-radius: 12px; padding: 2rem; max-width: 520px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; background: #065f46; color: #34d399; }
    .metric-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #334155; font-size: 0.95rem; }
    .metric-label { color: #94a3b8; }
    .metric-value { font-family: monospace; font-weight: bold; }
    .btn { margin-top: 1.5rem; width: 100%; padding: 0.75rem; background: #0284c7; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h1>Microservice Portal</h1>
      <span class="status-badge" id="fe-status">FE Ready</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Frontend Server:</span>
      <span class="metric-value">Nginx 1.27 Alpine</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Backend Connection:</span>
      <span class="metric-value" id="be-status">Checking...</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Backend Version:</span>
      <span class="metric-value" id="be-version">-</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Backend Pod Hostname:</span>
      <span class="metric-value" id="be-host">-</span>
    </div>
    <button class="btn" onclick="fetchBackendStatus()">Ping Backend API</button>
  </div>

  <script>
    async function fetchBackendStatus() {
      const statusEl = document.getElementById('be-status');
      const versionEl = document.getElementById('be-version');
      const hostEl = document.getElementById('be-host');
      statusEl.textContent = 'Connecting...';
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error('API returned ' + res.status);
        const data = await res.json();
        statusEl.textContent = data.status.toUpperCase();
        statusEl.style.color = '#34d399';
        versionEl.textContent = data.version;
        hostEl.textContent = data.hostname;
      } catch (err) {
        statusEl.textContent = 'Unreachable';
        statusEl.style.color = '#f87171';
        versionEl.textContent = 'N/A';
        hostEl.textContent = 'N/A';
      }
    }
    fetchBackendStatus();
  </script>
</body>
</html>
